# TLS reverse proxy in front of Orthanc.
# Orthanc itself is not published to the host — it is reachable only
# on the internal Docker network at http://orthanc:8042.

server {
    listen 445 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/orthanc.crt;
    ssl_certificate_key /etc/nginx/certs/orthanc.key;
    ssl_dhparam         /etc/nginx/certs/dhparam.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # DICOM studies are large. Do not cap the body size, and stream it
    # straight through rather than spooling the whole study to disk first.
    client_max_body_size     0;
    client_body_timeout      600s;
    proxy_request_buffering  off;
    proxy_buffering          off;
    proxy_max_temp_file_size 0;

    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 60s;

    # Keep credentials out of the access log. Uncomment to debug routing,
    # but remember the Authorization header is only base64-encoded.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://orthanc:8042;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Lets Orthanc build correct absolute URLs in DICOMweb responses.
        proxy_set_header X-Forwarded-Host  $http_host;
    }
}
